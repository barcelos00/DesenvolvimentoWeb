<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTCAR - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="cadastro">
    <nav id="app-nav" hidden></nav>
    <div id="app-status" class="app-status" role="status" aria-live="polite"></div>
    <main class="container auth-container">
        <div class="logo"><img src="../imagens/imagens_ex/logo.png" alt="Logo SOFTCAR"></div>
        <h2>Criar conta</h2>
        <form id="cadastro-form">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" maxlength="120" autocomplete="name" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="190" autocomplete="email" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required>
            <label for="confirmar-senha">Confirmar senha</label>
            <input id="confirmar-senha" name="confirmarSenha" type="password" minlength="6" autocomplete="new-password" required>
            <button type="submit" class="btn-destaque">Cadastrar</button>
        </form>
        <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
    </main>
</body>
</html>
