<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTCAR - Meu perfil</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="perfil" data-protected="true">
    <nav id="app-nav"></nav>
    <div id="app-status" class="app-status" role="status" aria-live="polite"></div>
    <main class="container">
        <h2>Meu perfil</h2>
        <form id="perfil-form" class="form-painel">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" maxlength="120" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="190" required>
            <label for="nova-senha">Nova senha (deixe em branco para manter a atual)</label>
            <input id="nova-senha" name="novaSenha" type="password" minlength="6" autocomplete="new-password">
            <button class="btn-destaque" type="submit">Salvar alterações</button>
        </form>
        <h2>Minhas simulações de pagamento</h2>
        <div id="historico-pagamentos"></div>
    </main>
    <footer id="app-footer"></footer>
</body>
</html>
