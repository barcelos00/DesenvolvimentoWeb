<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTCAR - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>

<body>
    <div class="container auth-container">

        <div class="logo">
            <img src="imagens/imagens_ex/logo.png" alt="logoSoftcar">
        </div>

        <h2>Entrar</h2>

        <form onsubmit="return fazerLogin();">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <p id="mensagem" class="auth-erro"></p>

            <button type="submit" class="btn-destaque">Entrar</button>
        </form>

        <p class="auth-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
</body>

</html>
